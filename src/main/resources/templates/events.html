<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Campus Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h1>Upcoming Events</h1>

    <div th:if="${message}" class="alert alert-warning" th:text="${message}"></div>

    <div th:if="${currentUser != null}" class="alert alert-info">
        Welcome, <strong th:text="${currentUser.name}">Name</strong>!
        (<span th:text="${currentUser.role}">Role</span>)
        <a th:href="@{/logout}" class="btn btn-sm btn-outline-secondary">Logout</a>
        <a th:if="${currentUser.role == 'STUDENT'}" th:href="@{/my-events}" class="btn btn-sm btn-outline-primary">My Registered Events</a>
    </div>

    <div th:if="${currentUser == null}" class="mb-3">
        <a th:href="@{/register}" class="btn btn-primary">Register</a>
        <a th:href="@{/login}" class="btn btn-outline-primary">Login</a>
    </div>

    <a th:if="${currentUser != null and currentUser.role == 'ORGANIZER'}" th:href="@{/events/new}" class="btn btn-success mb-3">+ Create New Event</a>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="event : ${events}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${event.title}">Event Title</h5>
                    <p class="card-text mb-1" th:text="${event.venue}">Venue</p>

                    <p class="card-text mb-1" th:if="${event.eventDateTime != null}">
                        <small class="text-muted">Event: <span th:text="${#temporals.format(event.eventDateTime, 'dd MMM yyyy, hh:mm a')}"></span></small>
                    </p>
                    <p class="card-text mb-1" th:if="${event.registrationDeadline != null}">
                        <small class="text-muted">Register by: <span th:text="${#temporals.format(event.registrationDeadline, 'dd MMM yyyy, hh:mm a')}"></span></small>
                    </p>

                    <p class="card-text mb-1" th:if="${event.teamEvent}">
                        <small class="text-muted">Team event: <span th:text="${event.minTeamSize} + '-' + ${event.maxTeamSize}"></span> members per team</small>
                    </p>

                    <p class="card-text">
                        <span class="badge bg-secondary" th:text="${event.registeredCount} + ' / ' + ${event.maxParticipants} + (${event.teamEvent} ? ' teams registered' : ' registered')"></span>
                        <span th:if="${!event.registrationOpen}" class="badge bg-danger">Registration closed</span>
                        <span th:if="${event.registrationOpen and event.full}" class="badge bg-warning text-dark">Full</span>
                    </p>

                    <form th:if="${currentUser != null and currentUser.role == 'STUDENT' and event.registrationOpen and !event.full}"
                          th:action="@{/events/{id}/register(id=${event.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-success">Register</button>
                    </form>

                    <a th:if="${currentUser != null and currentUser.role == 'ORGANIZER'}"
                       th:href="@{/events/{id}/participants(id=${event.id})}" class="btn btn-sm btn-outline-dark">View Participants</a>
                </div>
            </div>
        </div>
    </div>

    <p th:if="${events.isEmpty()}" class="text-muted">No events yet.</p>

</div>

</body>
</html>
