<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Registered Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h1 class="mb-3">My Registered Events</h1>

    <a th:href="@{/events}" class="btn btn-outline-secondary mb-3">Back to All Events</a>

    <div class="card mb-3" th:each="reg : ${registrations}">
        <div class="card-body">
            <h5 class="card-title" th:text="${reg.event.title}">Event Title</h5>
            <p class="card-text mb-1" th:text="${reg.event.venue}">Venue</p>

            <p class="card-text mb-1" th:if="${reg.event.eventDateTime != null}">
                <small class="text-muted"
                       th:text="${#temporals.format(reg.event.eventDateTime, 'dd MMM yyyy, hh:mm a')}"></small>
            </p>

            <!-- Solo registration -->
            <p class="card-text" th:if="${!reg.event.teamEvent}">
                Attended:
                <span th:text="${reg.attended} ? 'Yes' : 'No'"
                      th:classappend="${reg.attended} ? 'text-success' : 'text-muted'">No</span>
            </p>

            <!-- Team registration -->
            <div th:if="${reg.event.teamEvent}">
                <p class="mb-1">Team: <strong th:text="${reg.teamName}">Team</strong></p>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="m : ${reg.members}">
                        <span th:text="${m.name}">Member</span>
                        &mdash; Attended:
                        <span th:text="${m.attended} ? 'Yes' : 'No'"
                              th:classappend="${m.attended} ? 'text-success' : 'text-muted'">No</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <p th:if="${registrations.isEmpty()}" class="text-muted mt-3">You haven't registered for any events yet.</p>

</div>

</body>
</html>
